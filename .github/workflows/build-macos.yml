name: Build Kokoro Reader for macOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package unsigned app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Kokoro Reader.app"
          mkdir -p "$APP/Contents/MacOS"
          cp .build/release/KokoroReader "$APP/Contents/MacOS/KokoroReader"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Kokoro Reader</string>
          <key>CFBundleDisplayName</key><string>Kokoro Reader</string>
          <key>CFBundleIdentifier</key><string>app.kokororeader.mac</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>KokoroReader</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Kokoro-Reader-macOS.zip"
          hdiutil create -volname "Kokoro Reader" -srcfolder "$APP" -ov -format UDZO "dist/Kokoro-Reader-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Kokoro-Reader-macOS
          path: |
            dist/Kokoro-Reader-macOS.dmg
            dist/Kokoro-Reader-macOS.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kokoro-Reader-macOS.dmg
            dist/Kokoro-Reader-macOS.zip
          generate_release_notes: true
